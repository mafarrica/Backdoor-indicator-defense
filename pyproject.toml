[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backdoor-indicator"
version = "0.1.0"
description = "BackdoorIndicator: Leveraging OOD Data for Proactive Backdoor Detection in Federated Learning"
readme = "README.md"
requires-python = ">=3.8,<3.10"
license = "Apache-2.0"

dependencies = [
    "torch==1.13.0",
    "torchvision==0.14.0",
    "numpy==1.21.6",
    "matplotlib==3.5.3",
    "PyYAML==6.0.1",
    "scikit-learn==1.0.2",
    "scipy==1.7.3",
    "hdbscan==0.8.33",
    "Pillow==9.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=5.0",
]

[tool.setuptools]
packages = ["participants", "dataloader", "models", "utils"]

[tool.black]
line-length = 100
target-version = ["py37"]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
